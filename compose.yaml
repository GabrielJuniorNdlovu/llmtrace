# ============================================================================
# LLMTrace — Local Development Stack
# ============================================================================
#
# Quick start:
#   1. cp .env.example .env        # adjust if needed
#   2. docker compose up -d        # start infra services
#   3. docker compose logs -f      # watch for healthy status
#   4. cargo run --bin llmtrace-proxy -- --config config.yaml
#
# Run integration tests against these services:
#   source .env && cargo test --workspace -- --ignored
#
# Tear down:
#   docker compose down            # stop services (data persists in volumes)
#   docker compose down -v         # stop + delete all data
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # ClickHouse — Trace/span analytical storage (production TraceRepository)
  # --------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    ports:
      - "${CLICKHOUSE_PORT:-8123}:8123"     # HTTP interface
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"  # Native TCP
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-llmtrace}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # PostgreSQL — Metadata storage (tenants, configs, audit trail)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llmtrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmtrace}
      POSTGRES_DB: ${POSTGRES_DB:-llmtrace}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llmtrace}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Redis — Cache layer (hot queries, cost cap tracking, sessions)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Proxy — LLMTrace transparent proxy
  # --------------------------------------------------------------------------
  llmtrace-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/etc/llmtrace/config.yaml
    env_file:
      - .env
    environment:
      - LLMTRACE_CONFIG=/etc/llmtrace/config.yaml
      # Enable ML preload so /health reports Initializing progress for the dashboard bar.
      - LLMTRACE_ML_ENABLED=1
      - LLMTRACE_ML_PRELOAD=1
      # Upstream provider credential (from .env)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLMTRACE_UPSTREAM_URL=${LLMTRACE_UPSTREAM_URL}
      # Google OAuth (optional — email/password signup works without these)
      - LLMTRACE_GOOGLE_CLIENT_ID=${LLMTRACE_GOOGLE_CLIENT_ID:-}
      - LLMTRACE_GOOGLE_CLIENT_SECRET=${LLMTRACE_GOOGLE_CLIENT_SECRET:-}
      # Bootstrap operator key (used by "Sign in with admin key")
      - LLMTRACE_AUTH_ENABLED=${LLMTRACE_AUTH_ENABLED:-0}
      - LLMTRACE_AUTH_ADMIN_KEY=${LLMTRACE_AUTH_ADMIN_KEY:-}
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Dashboard — Next.js web UI for LLMTrace
  # --------------------------------------------------------------------------
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      # Server-side proxy URL (container networking). backend.ts accepts all
      # three names so Compose and host-side runners stay interchangeable.
      LLMTRACE_API_URL: "http://llmtrace-proxy:8080"
      LLMTRACE_PROXY_URL: "http://llmtrace-proxy:8080"
      LLMTRACE_BACKEND_URL: "http://llmtrace-proxy:8080"
      # ClickHouse URL for direct operations (deletion)
      CLICKHOUSE_URL: "http://clickhouse:8123"
      # Client-side URL (browser → proxy)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL:-http://localhost:3000}
      LLMTRACE_GOOGLE_CLIENT_ID: ${LLMTRACE_GOOGLE_CLIENT_ID:-}
      # Admin-key login compares against this value on the dashboard; the same
      # key must be configured on the proxy via LLMTRACE_AUTH_ADMIN_KEY.
      LLMTRACE_AUTH_ADMIN_KEY: ${LLMTRACE_AUTH_ADMIN_KEY:-}
      LLMTRACE_DASHBOARD_ADMIN_USERNAME: ${LLMTRACE_DASHBOARD_ADMIN_USERNAME:-admin}
      # Listen on all interfaces
      HOSTNAME: "0.0.0.0"
      # Local-dev escape hatch: skip the login gate when set to 1.
      # Set to 0 to exercise signup/login locally.
      LLMTRACE_DASHBOARD_AUTH_DISABLED: "${LLMTRACE_DASHBOARD_AUTH_DISABLED:-0}"
    depends_on:
      - llmtrace-proxy
    restart: unless-stopped

volumes:
  clickhouse_data:
  postgres_data:
  redis_data:
